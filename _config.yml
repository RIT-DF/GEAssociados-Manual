title: GE-Associados
description: "Manual do usuário do GE-Associados — gestão de associados e cobrança periódica nominal, pela RIT."
lang: pt-BR
permalink: pretty
# ⚠️ Sem domínio custom ainda: o manual serve na URL do Pages. Ao definir o domínio,
# preencha `url` aqui, crie o CNAME e preencha MANUAL_CUSTOM_DOMAIN no bin/config.sh.

# Tema como gem (buildado via GitHub Actions — ver .github/workflows/pages.yml).
theme: just-the-docs
plugins:
  - jekyll-seo-tag

defaults:
  - scope:
      path: ""
    values:
      layout: default

color_scheme: ge-associados

aux_links:
  "RIT":
    - "https://rit.org.br"
aux_links_new_tab: true

search_enabled: true
search:
  heading_level: 3
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false

heading_anchors: true

callouts:
  note:
    title: Nota
    color: blue
  tip:
    title: Dica
    color: green
  warning:
    title: Atenção
    color: yellow
  important:
    title: Importante
    color: red
  example:
    title: Exemplo
    color: purple

footer_content: '<strong>GE-Associados</strong> — ferramenta da <a href="https://rit.org.br" target="_blank" rel="noopener">RIT — Rede de Inovação e Tecnologia</a>. © 2026 RIT.'
last_edit_timestamp: false
back_to_top: true
back_to_top_text: "Voltar ao topo"
gh_edit_link: false

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - _manual
  - README.md
  - "*.sh"
